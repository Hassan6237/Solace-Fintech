<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Solace{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header>
  <nav>
    <a href="{{ url_for('index') }}" class="brand">
      <svg width="22" height="22" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="12" stroke="#E3A73B" stroke-width="1.4"/><path d="M8 14.5C8 14.5 9.8 17 13 17C16.2 17 18 14.5 18 14.5" stroke="#E3A73B" stroke-width="1.4" stroke-linecap="round"/></svg>
      Solace
    </a>
    <div class="navlinks">
      <a href="{{ url_for('learn') }}" class="{{ 'active' if request.endpoint in ['learn','lesson_detail'] else '' }}">Learn</a>
      <a href="{{ url_for('practice') }}" class="{{ 'active' if request.endpoint in ['practice','scenario_detail'] else '' }}">Practice</a>
      <a href="{{ url_for('reward') }}" class="{{ 'active' if request.endpoint == 'reward' else '' }}">Reward</a>
      <a href="{{ url_for('social') }}" class="{{ 'active' if request.endpoint == 'social' else '' }}">Social</a>
    </div>
    <div class="nav-right">
      <span class="points-pill">{{ session.get('points', 0) }} pts</span>
      <form action="{{ url_for('reset') }}" method="post" style="margin:0;">
        <button class="btn btn-ghost" style="padding:7px 14px; font-size:0.82rem;" type="submit">Reset demo</button>
      </form>
    </div>
  </nav>
</header>
<main>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</main>
<footer>
  <div class="wrap footer-row">
    <span>Solace prototype — demo data only, not a real bank connection or real money.</span>
    <span>18–25 financial capability concept</span>
  </div>
</footer>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
